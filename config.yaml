device: "cpu" # cuda:0, cpu
dt: 0.05
steps: 1000
sim_model: "SVGP"          # kinematic, dynamic, SVGP, SVGP_wet
mppi_model: "dynamic"         # kinematic, dynamic
v_target: 4.0                 # 2.5, 5.0


mppi: 
  device: "cpu" # cuda:0, cpu
  mppi_mode: "halton-spline"  # halton-spline, simple
  sampling_method: "halton"   # halton, random
  num_samples: 200 # 100
  horizon: 12                 # At least 12 for Halton Sampling
  lambda_: 0.051 # 0.051
  u_min: [0.0, -1.0]
  u_max: [1.0, 1.0]
  noise_sigma: [[0.8, 0.], [0., 1.5]]  # [[0.8, 0.], [0., 1.5]] # [[0.1, 0.], [0., 0.2]] [[0.5, 0.], [0., 0.5]]
  update_cov: False
  rollout_var_discount: 0.99 # 0.95
  sample_null_action: True
  noise_abs_cost: False
  filter_u: True
  use_priors: True
  u_per_command: 12

